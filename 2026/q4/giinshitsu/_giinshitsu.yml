role:
  title: チームみらいが議員に期待する役割・活動のあり方
  body: |
    チームみらいが所属議員に期待するのは、**５つのバリュー(手を動かす／オープンにする／誰かをおとしめない／分断を煽らない／何事も決めつけない)を体現しながら、デジタル民主主義の推進のため、議員しかできない・議員が行うことでより効果的なアクションを実践**することです。

    チームみらいの国会議員は12人であり、限られた人数と時間の中で成果を最大にするため、議員の活動も、メリハリをつけて行うこととし、党として求める活動に優先順位をつけています。

    **必ず求めること**

    - 議員本部や所属する本部のOKR達成に向けた活動
    - 国会への出席・質疑・政策議論等
    - 党として議員に報告を求めている情報の公開（例：調研費の公開、海外視察の報告など）
    - 議員として依頼された党務（式典・イベントへの出席等）

    **推奨すること**

    - 所属する委員会や担当の領域について専門性を深めるための自己研鑽
    - 知見の党内外への共有、専門領域での動画・記事等の発信

    **その他方針**

    チームみらいの国会議員は12人と限られた人数であるため、議員に特定の地域の代表としての役割を求めるよりも、党全体として国民のみなさま・国政に向き合うこと、デジタル民主主義の実践により地理的な制約を受けずに声を聞くことが大事だと考えています。

    そのため、地元の行事への出席や地域での国政報告会の実施など、特定の地域に根ざした活動を、党として議員に求めることはしていません。

    これは地域の声を聞かないということではなく、地域の声は、特定地域から選出された議員の有無によらず党として受け止め、内容に応じて適切な担当者のもとで、政策や国会での活動に反映させていきます。活動報告等の発信や、災害時など対応が必要となった際には、党として対応して参ります。

    ※この方針は今後も状況に応じてアップデートする予定です
premise:
  title: 「政府を動かした」とする条件
  body: |
    各議員室の「国を動かす事例」は、次の共通基準で達成を判定します。

    **成果の種類**（次のいずれか）

    - 答弁：大臣・副大臣・政務官や局長などの政府参考人が、国会質疑などの答弁で検討・実施・見直しを明言した。または、検討の場と時期を特定して検討を表明した。
    - 附帯決議：法案の附帯決議に提案内容が盛り込まれた。
    - 回答：提言の申し入れに対して、所管部局から具体的な対応方針を含む回答があった。
    - 政府文書：検討会資料、ガイドライン、概算要求などの政府の文書に提案が反映された。

    **達成とみなす基準**（すべて満たす）

    - 新規性：質疑・申し入れの前の時点で、政府がすでに実施を表明していた内容ではない。
    - 具体性：「検討してまいります」等の定型句ではなく、検討の場・時期・対象が特定されている。
    - 声とのつながり：AIインタビューの要旨と、質疑・申し入れ文書の該当箇所を対応づけて記録している。

    **目標の水準**

    - 確実にコミットする目標：答弁・附帯決議・回答のいずれかで、基準を満たす成果を1件以上つくる。
    - ストレッチ目標：その成果が、検討会資料、ガイドライン、概算要求などの政府文書への反映まで進む。
