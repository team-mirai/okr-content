copy: 農林水産業に対する党のビジョンの土台をつくる
objective:
  - 農林水産業に対する党のビジョンの土台を作る
krs:
  - k: KR3-1
    text: 見解を明確にする：スマート農業の推進について、論点や課題、チームみらいの考え方や他分野のマニフェストとの整合性を整理し、党としての見解の仮説を作る
    summary: スマート農業について、党の見解の仮説をつくる
    notes:
      - この見解は、公開文書ではなく内部文書になる可能性もある
    status: 未達成
  - k: KR3-2
    text: 議論をつなげる：当該見解を政調と共有し、食料安全保障やフードテックなど、関連する他分野へ議論をつなげる土台をつくる
    summary: 見解を政調と共有し、関連分野の議論につなげる
    status: 未達成
