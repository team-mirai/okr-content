kind: party
copy: 国対として、各議員室の「動かす」を支え、党の主張を国会運営に反映させる
krs:
  - k: KR2-1
    text: 交渉を支える：国対委員長が行う「動かす」をサポートする
    status: 未達成
  - k: KR2-2
    text: 各議員に伴走する：各議員が附帯決議を勝ち取れるよう、交渉に伴走する。各委員会の担当議員との連携を密にし、党の主張をできる限り政府の指針に反映させる
    status: 未達成
  - k: KR2-3
    text: 伝える：国対の考えをオープンにする発信に積極的に取り組み、動画等で伝える
    status: 未達成
