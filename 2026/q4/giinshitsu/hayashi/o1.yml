office: hayashi
id: hayashi-o1
label: O1
kind: move
copy: 国民の声で政府を動かした事例をつくる（委員会の開催状況を踏まえ調整中）
objective:
  - デジタル民主主義のサイクル（聴く→磨く→動かす→伝える）を回し、政府を動かした事例を1件つくる
  - 農林水産委員会の開催状況を踏まえて調整中
krs:
  - id: hayashi-o1-kr1-1
    k: KR1-1
    text: 会期中、AIインタビューを公開する。訪問・視察で、当事者に直接会う
    summary: AIインタビューを公開し、当事者に直接会う
    status: 未着手
  - id: hayashi-o1-kr1-2
    k: KR1-2
    text: なぜ今の制度・運用になっているのか、どんな制約があるのかを確かめる。「何を、どの文書（通知・運用等）で変えられるか」を整理する
    summary: 制度の背景と制約を確かめ、「何を、どの文書で変えられるか」を整理する
    status: 未着手
  - id: hayashi-o1-kr1-3
    k: KR1-3
    text: 質疑や提言の申し入れなどを通じて、会期末までに「政府を動かした」とする条件を満たす成果を1件以上つくる
    summary: 質疑や提言を通じて、政府を動かした成果を1件以上つくる
    status: 未着手
  - id: hayashi-o1-kr1-4
    k: KR1-4
    text: 質疑や申し入れを1回行うたびに、その理由、政府の答えを公開する
    summary: 質疑や申し入れのたびに、理由と政府の答えを公開する
    status: 未着手
