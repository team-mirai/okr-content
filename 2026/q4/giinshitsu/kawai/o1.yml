office: kawai
id: kawai-o1
label: O1
kind: move
copy: 文部科学委員会の法案で、声を踏まえた賛否と質疑を公開する
objective:
  - 文部科学委員会に付託される法案で、デジタル民主主義サイクル（聴く→磨く→動かす→伝える）を回し、声を踏まえた賛否と質疑を公開する
  - 対象法案：公立学校の学校医、学校歯科医及び学校薬剤師の公務災害補償に関する法律の一部を改正する法律案（閣法・提出予定）。療養補償等を受ける権利の消滅時効を2年から5年に延ばすこと等が柱。
krs:
  - id: kawai-o1-kr1-1
    k: KR1-1
    text: AIインタビュー等で、学校医・学校歯科医・学校薬剤師など、法案の影響を受ける当事者の声を集める
    summary: 法案の影響を受ける当事者の声を集める
    status: 未着手
  - id: kawai-o1-kr1-2
    k: KR1-2
    text: 集めた声を、党の賛否判断と法案質疑に反映する
    summary: 集めた声を、党の賛否判断と法案質疑に反映する
    status: 未着手
  - id: kawai-o1-kr1-3
    k: KR1-3
    text: 声をどのように反映したかを、法案の振り返り動画で解説する
    summary: 声をどのように反映したかを、法案の振り返り動画で解説する
    status: 未着手
