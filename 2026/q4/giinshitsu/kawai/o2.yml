office: kawai
id: kawai-o2
label: O2
kind: move
copy: 一般質疑の注力テーマで、デジタル民主主義サイクルを回し、政府を動かした実績を1件つくる
notes:
  - 注力テーマは未定。候補は通信制高校の質の確保。改正定時制・通信教育振興法で文部科学大臣が定める基本指針に、生徒・保護者・サポート校関係者の声を反映させる答弁を目指す。
  - 「政府を動かした」とする条件は、議員本部の共通基準に従う（成果の種類：答弁、附帯決議、申し入れへの回答、政府文書への反映／達成の基準：新規性、具体性、声とのつながりをすべて満たす）。
krs:
  - k: KR2-1
    tag: 聴く
    text: AIインタビュー等で、当事者の声を50件以上集める
    status: 未達成
  - k: KR2-2
    tag: 磨く・動かす
    text: 集めた声をもとにワークショップを開き、アイディアを磨く議論の場をつくる。一般質疑と提言を通じて、会期末までに「政府を動かした」とする条件を満たす成果を1件以上つくる
    status: 未達成
  - k: KR2-3
    tag: 伝える
    text: テキスト：質疑や申し入れを1回行うたびに、集まった声をどう使ったか（使わなかった場合はその理由）と政府の答えを、1週間以内にnoteで公開する
    status: 未達成
  - k: KR2-4
    tag: 伝える
    text: 動画：振り返り動画で、このテーマの聴く→磨く→動かす→伝えるの流れを伝える
    status: 未達成
