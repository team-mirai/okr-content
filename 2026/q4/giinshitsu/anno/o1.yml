office: anno
id: anno-o1
label: O1
kind: move
copy: 全法令をAIで点検し続ける仕組みを政府につくる
objective:
  - AIで法律・政令・省令を総点検し、時代遅れの規定を洗い出し、直し続ける仕組みを政府の中に作る
  - デジタル庁のアナログ規定の見直しでは法律や政令、省令に残る「対面で」「書面で」など、デジタル化以前の前提を引きずった規定を一斉に見直した。この手法を応用し、AIに全法律・政令・省令を読ませて網羅的に点検し、時代に合わない規定は見直すよう課題提起、政府に対応を促すのが狙い。
krs:
  - id: anno-o1-kr1-1
    k: KR1-1
    text: 改正候補を公開し、事業者・自治体職員・法務実務者から「実際に困っている規定」をAIインタビューやヒアリングで集める
    summary: 改正候補を公開し、当事者から「実際に困っている規定」の声を集める
    status: 未着手
  - id: anno-o1-kr1-2
    k: KR1-2
    text: 集まった声で候補に優先順位をつけ、政府への提案にまとめる
    summary: 集まった声で候補に優先順位をつけ、政府への提案にまとめる
    status: 未着手
  - id: anno-o1-kr1-3
    k: KR1-3
    text: 国会の場でAIによる全法令の定期点検を政府の仕組みに組み込むよう求め、検討の場と時期が特定された対応を引き出す
    summary: AIによる全法令の定期点検を、政府の仕組みに組み込むような対応を引き出す
    status: 未着手
