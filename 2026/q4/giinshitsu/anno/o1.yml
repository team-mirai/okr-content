office: anno
id: anno-o1
label: O1
kind: move
copy: AIで法律・政令・省令を総点検し、時代遅れの規定を直し続ける仕組みを政府の中に作る
notes:
  - 法律や政令、省令には「対面で」「書面で」など、デジタル化以前の前提を引きずったアナログ規定が多く残る。AIに全法律を読ませ、新たな改正候補を数十件見つけており、これを一議員の実験で終わらせず、政府の仕事にするのが狙い。
krs:
  - k: KR1-1
    tag: 聴く
    text: 改正候補を公開し、事業者・自治体職員・法務実務者から「実際に困っている規定」をAIインタビューやヒアリングで集める
    status: 未達成
  - k: KR1-2
    tag: 磨く
    text: 集まった声で候補に優先順位をつけ、政府への提案にまとめる
    status: 未達成
  - k: KR1-3
    tag: 動かす
    text: 国会の場でAIによる全法令の定期点検を政府の仕組みに組み込むよう求め、検討の場と時期が特定された対応を引き出す
    status: 未達成
