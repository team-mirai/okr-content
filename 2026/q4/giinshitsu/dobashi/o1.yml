office: dobashi
id: dobashi-o1
label: O1
kind: move
copy: 視察で見た課題から政府の対応を引き出す
objective:
  - 視察で見た現場の課題を出発点に、国民の声を集めて国会で提案し、政府の具体的な対応を1件引き出す
krs:
  - id: dobashi-o1-kr1-1
    k: KR1-1
    text: 視察報告を公開し、同じテーマのAIインタビューを始める。対象は会期中の視察と、実施済みの5件（ロンドン・韓国・六ヶ所村・産総研・モンゴル）
    summary: 視察報告を公開し、同じテーマでAIインタビューを始める
    status: 未着手
  - id: dobashi-o1-kr1-2
    k: KR1-2
    text: 集まった声と視察で見た現場を突き合わせ、質疑で扱う論点を2テーマ以上まとめる
    summary: 声と現場を突き合わせ、質疑の論点を2テーマ以上まとめる
    status: 未着手
  - id: dobashi-o1-kr1-3
    k: KR1-3
    text: 候補となるテーマから選んだものを外務委員会の一般質疑で取り上げ、共通基準（「政府を動かした」とする条件）を満たす対応を1件引き出す
    summary: 外務委員会の一般質疑で、政府の対応を1件引き出す
    notes:
      - 候補1 文化外交：ジャパン・ハウスでのアニメ・マンガ・ゲーム発信など、海外の日本ファンを増やす取り組みの具体化
      - 候補2 エネルギー安全保障・資源外交：六ヶ所村・産総研・モンゴルの視察を踏まえ、中東情勢もにらんだ資源確保
    status: 未着手
  - id: dobashi-o1-kr1-4
    k: KR1-4
    text: 質疑から1週間以内に「視察→声→質疑→政府の答え」の流れを公開する。取り上げなかった声には、その理由を添える
    summary: 質疑から1週間以内に、視察から政府の答えまでの流れを公開する
    status: 未着手
