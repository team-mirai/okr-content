office: mineshima
id: mineshima-o1
label: O1
kind: move
copy: 「声が国会を動かした」事例をつくる
objective:
  - 聴いた声を根拠に国会内の議論を動かし、「声が国会を動かした」事例を1件つくる
krs:
  - id: mineshima-o1-kr1-1
    k: KR1-1
    text: 消費税・支援金法または議員定数削減法についてAIインタビューを公開し、回答を300件以上集める
    summary: AIインタビューで回答を300件以上集める
    status: 未着手
  - id: mineshima-o1-kr1-2
    k: KR1-2
    text: 会いに行く：課題の当事者や関係者に、会期中に計5件直接会う
    summary: 課題の当事者や関係者に、5件直接会う
    notes:
      - 会う相手：課題当事者、企業、研究者、自治体の選挙管理委員会、有権者団体など
      - 有識者との面談の記録は先方からNGが出ない限り公開にする
    status: 未着手
  - id: mineshima-o1-kr1-3
    k: KR1-3
    text: 会期末までに、次のどれか1つを、声とのつながりを記録したうえで実現する
    summary: 声を根拠に、国会の議論を動かした成果を1件つくる
    notes:
      - 委員会・協議会の論点整理や報告書に、党の提案が載る
      - 委員会・他党が協議会で党の提案に言及するか、賛同する
      - チームみらい案を他党に提案し、1党以上が検討または賛同の意思を示す（提案の方法は問わない。例：衆議院の全党への提案、各党の担当者への個別の申し入れ、他党議員との勉強会、超党派の議連や協議会の場での提示）
    status: 未着手
  - id: mineshima-o1-kr1-4
    k: KR1-4
    text: 委員会・協議会の動きや質疑は全て1週間以内にSNS上で報告する
    summary: 委員会・協議会の動きを、1週間以内にSNSで報告する
    status: 未着手
