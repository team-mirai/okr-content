office: kobayashi
id: kobayashi-o2
label: O2
kind: party
copy: エンジニア議員として、アクションボードと議題発信の仕組みを作り、学生チームと政調との連携を党の型にする
krs:
  - k: KR2-1
    text: アクションボード：開発に関わるメンバーと協力し、使う人が夢中になれる新しいアクションボードを12月末までに開発する（公開時期と形は開発本部と合意する）
    status: 未達成
  - k: KR2-2
    text: 議題発信：O1のデジタル民主主義を浸透させる取り組みとして、ウェブサイト上での議題発信を会期中に1本以上実施する
    status: 未達成
  - k: KR2-3
    text: 学生チームとの連携：これまで築いてきた学生との信頼関係を活かし、政策立案や各種イベントに学生が参加できる接続点になる（会期中に1件以上）。学生チーム代表と協力し、学生チームを発展させた体制（学生本部など）と、学生の意欲を最大限活かす仕組みを「学生チームRebuildプロジェクト」として12月末までに具体案にする
    status: 未達成
  - k: KR2-4
    text: 政調との連携：質疑等の機会を通じて政調と連携し、会期末までに党内での連携ベストプラクティスを1本まとめる
    status: 未達成
