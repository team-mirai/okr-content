office: kobayashi
id: kobayashi-o2
label: O2
kind: move
copy: 独自の情報発信を通じて政治をもっと身近に感じてもらう
objective:
  - エンジニア議員として、注目している法案や取り組んでいる課題の解説ページ、議員活動の記録の公開など、独自の情報発信に取り組み、政治の動きを身近に感じてもらう
krs:
  - k: KR2-1
    text: 解説特集：注目している法案や、議員として取り組んでいる課題について、インタラクティブな解説ページをウェブサイトで１本以上公開する
    summary: 注目している法案や取り組んでいる課題の解説ページを、会期中に1本以上公開する
    status: 未達成
  - k: KR2-2
    text: 活動記録の見える化：国会での質疑、視察、会議など、議員としての活動の記録を公開できる限りウェブサイトで遅延なく公開する
    summary: 議員としての活動記録を、ウェブサイトで見える化しトラッキングできる状態にする
    status: 未達成
