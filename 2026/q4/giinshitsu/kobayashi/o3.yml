office: kobayashi
id: kobayashi-o3
label: O3
kind: party
copy: エンジニア議員として政党の活動に貢献する
objective:
  - エンジニア議員としてチームみらいのソフトウェア開発に参画し、政党の活動に貢献する
  - 学生チームとの連携を通じて、若い世代が政治に参加できる接点を増やす
krs:
  - id: kobayashi-o3-kr3-1
    k: KR3-1
    text: ソフトウェア開発：開発本部、組織活動本部、広聴本部、広報本部と連携しながら、使う人が楽しめる新しいアクションボードを12月末までに開発する（公開時期は各本部と合意のうえ調整する）
    summary: 関係本部と連携し、新しいアクションボードを12月末までに開発する
    status: 未着手
  - id: kobayashi-o3-kr3-2
    k: KR3-2
    text: 学生チームとの連携：これまで築いてきた学生との関係を重視し、政策立案や各種イベントに学生が参加できる仕組みを12月末までに具体案にする
    summary: 学生が参加できる場をつくり、学生チームの新体制案を協力しながら12月末までにまとめる
    status: 未着手
