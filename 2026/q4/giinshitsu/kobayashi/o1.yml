office: kobayashi
id: kobayashi-o1
label: O1
kind: move
copy: 担当委員会の法案を解説し、国会の議論をわかりやすく伝える
objective:
  - 担当委員会の法案について解説資料などをウェブサイトで公開し、どのような議論が行われるのかをわかりやすく伝える
  - 法案についてAIインタビューや視察を通じて情報を集め、質疑につなげ、法案がどうなったかまで報告する
  - 対象分野：経済産業委員会（特に新産業、科学技術分野）
krs:
  - id: kobayashi-o1-kr1-1
    k: KR1-1
    text: 会期中に経済産業委員会に付託された法案について、委員会での審議前に、概要や主な論点をまとめた解説資料などをウェブサイトで公開し、関心を集める
    summary: 担当委員会の法案について、審議前に解説資料をウェブサイトで公開する
    status: 未着手
  - id: kobayashi-o1-kr1-2
    k: KR1-2
    text: 担当委員会の法案について、解説資料をSNS等で告知して参加を呼びかける。AIインタビューや視察などで集めた声と現場の情報をもとに委員会で質疑し、共通の達成基準を満たす成果を会期中に1件つくる
    summary: AIインタビューや視察で声を集め、質疑で共通基準を満たす成果を1件つくる
    status: 未着手
  - id: kobayashi-o1-kr1-3
    k: KR1-3
    text: 会期中に経済産業委員会に付託された法案について、審議の結果（可決・修正・附帯決議など）を解説資料に追記して報告する
    summary: 担当委員会の法案について、審議の結果を解説資料に追記して報告する
    status: 未着手
