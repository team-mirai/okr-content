office: kobayashi
id: kobayashi-o1
label: O1
kind: move
copy: 「伝える→聴く＆磨く→動かす」の流れでサイクルを組み上げ、委員会質疑で国を動かした事例を1件つくる
notes:
  - 対象分野：経済産業委員会（特に新産業、科学技術分野）
krs:
  - k: KR1-1
    tag: 伝える
    text: 質疑の1か月前までに、何が議題となっているかをSNS等で発信し、「みらい議会・AIインタビュー」への参加を呼びかける。余裕があれば、調べていることのドラフトをウェブサイト上の議題特集として公開し、AIインタビューへの導線にする（会期中に1テーマ以上）
    status: 未達成
  - k: KR1-2
    tag: 聴く＆磨く
    text: AIインタビューで有識者の意見を集め、様々な方法で情報収集して質疑内容を練る。質疑までに意味のある視察を1回以上行い、ドラフトを磨く
    status: 未達成
  - k: KR1-3
    tag: 動かす
    text: 実際に委員会で質疑し、共通の達成基準を満たす成果を会期中に1件つくる
    status: 未達成
