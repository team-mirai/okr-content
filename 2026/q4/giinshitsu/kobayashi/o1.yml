office: kobayashi
id: kobayashi-o1
label: O1
kind: move
copy: 経済産業委員会の質疑で国を動かした事例をつくる
objective:
  - 「伝える→聴く＆磨く→動かす」の流れでサイクルを組み上げ、委員会質疑で国を動かした事例を1件つくる
  - 対象分野：経済産業委員会（特に新産業、科学技術分野）
krs:
  - id: kobayashi-o1-kr1-1
    k: KR1-1
    text: 質疑の1か月前までに、何が議題となっているかをSNS等で発信し、「みらい議会・AIインタビュー」への参加を呼びかける。余裕があれば、調べていることのドラフトをウェブサイト上の議題特集として公開し、AIインタビューへの導線にする（会期中に1テーマ以上）
    summary: 質疑の1か月前までに議題を発信し、AIインタビューへの参加を呼びかける
    status: 未着手
  - id: kobayashi-o1-kr1-2
    k: KR1-2
    text: AIインタビューで有識者の意見を集め、様々な方法で情報収集して質疑内容を練る。質疑までに意味のある視察を1回以上行い、ドラフトを磨く
    summary: 有識者の声と視察をもとに、質疑内容を練る
    status: 未着手
  - id: kobayashi-o1-kr1-3
    k: KR1-3
    text: 実際に委員会で質疑し、共通の達成基準を満たす成果を会期中に1件つくる
    summary: 委員会質疑で、共通基準を満たす成果を1件つくる
    status: 未着手
