office: muto
id: muto-o2
label: O2
kind: party
copy: サイクルの実践記録やKPTを残しつつ、国会運営で各議員室を支える
objective:
  - 事務所で「聴く・磨く・動かす・伝える」のサイクルを実践した記録を、党の「型の直しどころ」（KPT）として残す。また、国対委員長代理として、国会運営の面から各議員室のサイクルが回りやすい環境を整える
krs:
  - k: KR2-1
    text: サイクル一周ごとにKPTを記録し、クイックウィンはその場で改善する
    summary: サイクルごとにKPTを記録し、すぐ直せる点は直す
    status: 未達成
  - k: KR2-2
    text: 12月末までに、党全体で対応すべき論点（KPT）を議員本部・政調に共有し、各論点の担当と対応方針が決まっている状態にする
    summary: 党全体の論点を12月末までに共有し、担当と方針を決める
    status: 未達成
  - k: KR2-3
    text: 国対委員長代理として、各議員室の質疑機会（一般質疑の割り当て・日程見通しなど）を早めに共有し、各室が「動かす」の準備に入れるようにする
    summary: 各議員室に、質疑の機会を早めに共有する
    status: 未達成
