office: takayama
id: takayama-o3
label: O3
kind: party
copy: 国対委員長として、チームみらいの国会での仕事への共感を広げる
notes:
  - 国会で起きていることを自分の言葉で語り、オフライン・オンライン両面で対話する
krs:
  - k: KR3-1
    text: メディア：幹事長や広報本部と連携しながら幹部会見やぶら下がりを活用し、国対の考え方や交渉の成果をメディアに適切に伝えられる体制をつくる
    status: 未達成
  - k: KR3-2
    text: オンライン：動画やテキスト記事で合計3本以上、国会で起きたことやチームみらいの国対の考え方を自分の言葉で発信する
    status: 未達成
  - k: KR3-3
    text: オフライン：党員・サポーターに限らず、広く有権者が「デジタル民主主義を実践するチームみらいの国対」と対面で対話できる場を2回以上開き、継続的に双方向の対話ができる仕組みをつくることで、開かれた接点を広げていく
    status: 未達成
