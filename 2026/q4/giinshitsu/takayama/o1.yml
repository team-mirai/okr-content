office: takayama
id: takayama-o1
label: O1
kind: move
copy: AI政策、経済安全保障など、内閣委員会所管のテーマで、国民の声を国会に届けることで政策実現を前進させる
notes:
  - 候補1：政府のAI政策のアップデート（AI基本計画、AI推進法などのアップデート、日本成長戦略実行計画へのAI戦略の反映）
  - 候補2：内閣委員会に付託される法案（法人の実質的支配者把握に関する法案、重要土地等調査法改正案 等）
  - 担当分野の政策や法案で、聴く→磨く→動かす→伝えるのサイクルを回す
krs:
  - k: KR1-1
    tag: 聴く
    text: 各テーマで影響を受ける当事者や有識者の声をAIインタビューや個別のヒアリングで聴く
    status: 未達成
  - k: KR1-2
    tag: 磨く
    text: 政調のAI政策PTのリーダーや内閣委員会の委員等の役割を通して、集約した声を踏まえた政策への示唆や法案に対するスタンスをまとめる
    status: 未達成
  - k: KR1-3
    tag: 動かす
    text: 政府や各党との議論を通して、政策実現を前進させる（政府の計画への反映、法案修正・附帯決議、政府答弁、政党間合意 等）
    status: 未達成
  - k: KR1-4
    tag: 伝える
    text: 聴く→磨く→動かすの成功事例を1件以上発信する
    status: 未達成
