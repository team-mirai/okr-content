copy: 国対委員長として、各議員室と力を合わせて、各党との交渉で成果をつくる
objective:
  - 国対委員長として、12の議員室と力を合わせて、与野党各党との交渉で成果をつくる
  - 国対OKRの「デジタル民主主義の手法と国会での交渉により成果をつくる」の実現に向けて、各議員室と連携する
