office: usami
id: usami-o1
label: O1
kind: move
copy: 自衛官の定員確保に向けて政府を動かす
objective:
  - 未来に安全保障体制を維持するため、自衛官の定員を確保する
  - そのための必要な施策を実施するよう政府を動かす
krs:
  - id: usami-o1-kr1-1
    k: KR1-1
    text: 自衛官の処遇についてのAIインタビュー
    summary: 自衛官の処遇についてAIインタビューを行う
    notes:
      - 給与以外の離職要因（住環境、転勤と家族の仕事、子どもの転校、退職後の資格・再就職）を集める
      - 補足で対面インタビューも検討
    status: 未着手
  - id: usami-o1-kr1-2
    k: KR1-2
    text: AIアンケート調査結果を精査、分析し、委員会質疑、省庁ディスカッション等で、政府・防衛省に届ける
    summary: 調査結果を分析し、政府・防衛省に届ける
    notes:
      - 臨時国会では安全保障委員会において、防衛省の職員の給与等に関する法律の一部改正法案の審議が予定されており、アンケート調査結果で得られた給与以外の離職要因を改善するための施策を検討・実施すると答弁を引き出す
    status: 未着手
  - id: usami-o1-kr1-3
    k: KR1-3
    text: SNS等で公開する
    summary: 進捗と政府の答えをSNS等で公開する
    notes:
      - 公開内容：聴く、磨く・動かすの進捗
      - 公開内容：政府から得られた答え
    status: 未着手
