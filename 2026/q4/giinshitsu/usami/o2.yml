label: O2
kind: move
copy: 沖縄の子どもの貧困と教育格差をなくす
objective:
  - 沖縄における子どもの貧困と教育機会の格差を解消する
  - 沖縄の子どもの貧困と教育格差をネットとAIで埋める
  - 本年6月、すでに沖縄についてのAIインタビューを実施。調査結果から浮き彫りになったのは「教育格差と次世代への投資不足」が懸念されているということであった。
  - AIインタビューで浮き彫りになった沖縄の子どもの貧困と教育格差を埋めるための施策の実施・予算の拡充を政府に求め、実現を目指す。また、沖縄の子どもの貧困と教育格差をネットとAIで埋めることも働きかけていく。
