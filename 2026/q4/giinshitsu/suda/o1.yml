office: suda
id: suda-o1
label: O1
kind: move
copy: 国交分野で、デジタル民主主義サイクル（聴く→磨く→動かす→伝える）を回した2回目の実績を作り、国会でサイクルを回すフローを完成させる
notes:
  - 注力テーマ「自動運転政策の進展」：AIインタビューで、交通・物流事業者（タクシー、バス、トラック等）・自動運転の開発を進める事業者・自動車メーカーなどの声を集める。普及が都市部に限られ地方の移動の確保につながらない、実証実験にとどまり事業として続かない、国内に技術や知見が蓄積されない、事故時の責任の所在が明確にならないまま広がる、といった事態に陥らないよう、自動運転の早期普及を実現するための論点の整理を行う。現場の要望をまとめ、質疑・提言で扱う論点を絞る。
  - 注力テーマ「子育て×まちづくり」：AIインタビューで、子育て中の人から困りごとを幅広く集める。送り迎えの移動手段、電車のベビーカー利用、駅や施設の授乳室などについて、困った場面や諦めたことを尋ねる。7/15に始まった「バリアフリー施策の新たな枠組みに関する検討会」の論点に、乳幼児連れの人のための指標（ベビーカースペース、おむつ替え台など）や子育て世帯の移動を加える答弁を目指す。
  - 注力テーマ「港湾と船の自動化・デジタル化」：AIインタビューで、船員、海運・造船事業者、港湾関係者、離島で船を使う人等の声を集める。労働環境の改善、サイバー攻撃への備え等について、導入の妨げになっていることを尋ねる。自動運航船検討会の議論を加速させる答弁を目指す。
krs:
  - k: KR1-1
    tag: 聴く
    text: 法案及び一般質疑に関するAIインタビューを早期に始め、一般向けは50件、事業者向けは30件以上の回答を集める
    status: 未達成
  - k: KR1-2
    tag: 磨く・動かす
    text: 一般質疑と提言の申し入れを通じて、会期末までに政府を動かしたとする条件を満たす成果を1件以上つくる
    status: 未達成
  - k: KR1-3
    tag: 伝える
    text: テキスト：質疑や申し入れを1回行うたびに、集まった声をどう使ったか（使わなかった場合はその理由）と政府の答えを1週間以内にnoteなどで公開する
    status: 未達成
  - k: KR1-4
    tag: 伝える
    text: 動画：臨時国会中に出すショート動画のうち3本を、O1・O2のテーマで、聴く→磨く→動かす→伝えるの流れを伝えるものにする
    status: 未達成
  - k: KR1-5
    tag: サイクル
    text: フローを完成させる：12月末までに、デジタル民主主義サイクルを活用した効果的な質疑のフローをドキュメント化し、議員本部に共有する
    status: 未達成
