office: yamada
id: yamada-o1
label: O1
kind: move
copy: 災害対策・総務の分野で政府を動かした実績をつくる
objective:
  - 災害対策特別委員会と総務委員会の分野で、デジタル民主主義サイクル（聴く→磨く→動かす→伝える）を回し、政府を動かした実績を1件つくる
krs:
  - k: KR1-1
    tag: 聴く
    text: 所属委員会の各所管事項について、次の対象者にAIインタビューを実施
    summary: 所属委員会の分野で、関係者にAIインタビューを行う
    notes:
      - 総務委：生活者、自治体職員等の様々なレイヤー
      - 災害委：被災者、被災地の住民、自治体・社会福祉施設・支援団体等
    status: 未達成
  - k: KR1-2
    tag: 磨く
    text: 各委員会の所管対象ごとにそれぞれ「個別具体な声」が届くと思うが、それらの根幹にある原因・理由を解明し、現行の仕組み・制度の改善に必要な対応・対策を提案できるような分析を行う
    summary: 声の根本にある原因を分析し、制度改善の案につなげる
    status: 未達成
  - k: KR1-3
    tag: 動かす
    text: 一般質疑・附帯決議・議連等を通じて、会期末までに「政府を動かした」といえるような成果を1件以上つくる
    summary: 会期末までに、政府を動かした成果を1件以上つくる
    notes:
      - 防災庁設置法の附帯決議（プッシュ型支援・減災）の履行状況を所管部局に確認し、公開する
      - 前会期における防災庁設置法案での質疑後の進捗を確認する質疑を行い、前進を促す（例：フェーズフリーの考え）
    status: 未達成
  - k: KR1-4
    tag: 伝える
    text: 実施したAIインタビューについては、集まった声をどう活用したか（活用できなかった場合はその理由）と政府の答弁内容を、noteまたは動画で公開する
    summary: 声の活用の仕方と政府の答弁を、noteや動画で公開する
    notes:
      - 各AIインタビューの報告（数、時間、声など）をnoteまたは動画で公開する
    status: 未達成
