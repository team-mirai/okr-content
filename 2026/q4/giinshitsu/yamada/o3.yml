kind: party
copy: 参議院総務委員会所属の安野議員室と連携する
krs:
  - k: KR3-1
    text: 情報をそろえる：総務委員会所管の法案やホットトピックのレクを安野議員室と共同で受け、論点の認識合わせと質疑連携の可否を定期的に共有する
    status: 未達成
  - k: KR3-2
    text: 役割を分ける：可能であれば、先に扱う衆議院総務委員会での質疑内容を参議院総務委員会における質疑と連携させ、答弁の深堀りができるポイントを模索する
    status: 未達成
