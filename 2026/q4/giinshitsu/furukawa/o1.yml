office: furukawa
id: furukawa-o1
label: O1
kind: move
copy: 国民の声で厚生労働分野の国の運用を変えた事例をつくる
objective:
  - 国民から寄せられた声を起点に、厚生労働分野で、国の運用を変えた（または改める中身と時期を政府に約束させた）事例を1件つくる
  - AI失業の提言や、「政策についてのご意見」AIインタビュー等による広聴の結果から選んだテーマをもとに政府を動かす。想定されるテーマとしては、報酬改定に向けた政府の検討において、プッシュ型支援、制度のバグ修正、EBPM、オープンデータ活用といった視点がある。
