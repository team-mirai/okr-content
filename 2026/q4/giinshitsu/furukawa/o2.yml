kind: party
copy: 幹事長・議員本部長として党OKR・議員室OKRの達成を図る
krs:
  - k: KR2-1
    text: （幹事長として）全体MTGの場などを活用し、全体の進捗を把握するとともに、OKRの運用体制を随時改善する
    status: 未達成
  - k: KR2-2
    text: （議員本部長として）各議員室にOKRの運用ルールを浸透させる
    status: 未達成
  - k: KR2-3
    text: （議員本部長として）議員室の稼働状況や業務量を把握し、採用や配属、業務量を調整することでOKR達成に近づける
    status: 未達成
