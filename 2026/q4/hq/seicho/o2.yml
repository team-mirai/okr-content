- 国民の声で政策案が磨かれる「デジタル民主主義ループ」の実例を、政調テーマと国会審議の両方で生み出す デジタル民主主義サイクルの「磨く」担当として、国民・有識者との熟議を行いながら、法案賛否判断や重要政策づくりを実施するために、政策テーマに関するデジタル民主主義ループの実例づくりを政策内容・プロジェクトマネジメント観点から進める。
