  k: KR3-1
  text: （メニューの整備）活動メニュー（見る・知る、拡散する、伝えるの各メニュー）がアクションボード上で公開されており、奨励度合いをもとにポイントが設計されている。
  summary: 活動メニューとポイントを、アクションボードで公開する
