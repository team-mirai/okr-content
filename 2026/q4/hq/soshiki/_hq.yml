id: soshiki
order: 7
name: 組織活動本部
short: 組活
desc: サポーターと全国の地域活動を支え、党の力につなげる
premise:
  title: 組織活動の考え方
  body: |-
    #### 党の組織活動の目的

    広く市民を巻き込んでデジタル民主主義の実践者と実践の場を社会に増やす

    #### 組織活動の戦略

    基本的な考え方：デジタル民主主義のプロダクトを使う場に参加した人が、良い体験だと感じて他の人に推奨し次の利用者を連れてくることで、デジタル民主主義を実践する場と人の数を伸ばす。

    そのために下記の両輪を回す

    - 内輪：核となる1%のサポーター（伝道師、エバンジェリスト）に、デジタル民主主義を体験するイベントを主催してもらい、9%の積極的なサポーターや一般の方の参加を促す
    - 外輪：90%の大多数のサポーターに、デジ民の認知を広める活動・より良く理解する活動をしてもらう
