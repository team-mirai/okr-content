hq: kokutai
id: kokutai-o1
label: O1
copy: 国民の声を国会での成果につなげる
objective:
- デジタル民主主義の手法と国会での交渉により成果をつくる
objective_list:
- 臨時国会で、チームみらいの要求が法案修正・附帯決議・政府答弁のいずれかの形で国会に残っている状態をつくり、通常国会でより大きな成果が得られるようにする
- しかも、それは審議拒否のような政局型の手段によらず、国民全体に開かれた合意形成や他党との協調によるものでありたい
- そのためにデジタル民主主義的な手法（AIインタビューやゆる語りワークショップ）を駆使して、「国民の声が国会を動かした実例」を国対が作れている状態にしたい
krs:
- id: kokutai-o1-kr1-1
  k: KR1-1
  text: チームみらいの要求実現を法案修正・附帯決議・政府答弁で勝ち取る
  summary: 法案修正・附帯決議・政府答弁の中で2件の要求を通す
  notes:
  - デジタル民主主義の実践として事例化できるものを臨時国会で2件以上
  - 法案修正・附帯決議は出てくる法案等に依存するため内訳は問わない
  - 件数目標に関わらず、各議員室とのやりとりを密にして、国対観点で質疑・附帯決議に盛り込んでほしい論点の認識を合わせられるようにする
  metrics:
  - c: 0
    t: 2
    u: 件
  status: 注意
- id: kokutai-o1-kr1-2
  k: KR1-2
  text: 他党と共同での議員立法提出を実現する
  summary: 他党と共同で議員立法を提出する
  notes:
  - デジタル民主主義のプロセスを活用した法案提出を臨時国会で1件以上
  - 提出候補は2件以上並べ、協議の件数も行動量として記録する
  - 18歳の壁、こどもSNS、同日選挙　など
  metrics:
  - c: 未着手
    t: 1
    u: 件
  status: 未着手
- id: kokutai-o1-kr1-3
  k: KR1-3
  text: 政局型の手段を取らず、合意形成や政策面での協調によって国会運営する
  summary: 審議拒否をせず、合意形成と政策協調で国会運営する
  notes:
  - 審議拒否のカードを切る回数を0回に
  - この方針自体をオープンにしつつ、この方針を曲げてまで審議拒否しないといけないような事態を回避できるよう努力する
  metrics:
  - c: 0
    t: 0
    u: 回
    cmp: ≦
  status: 順調
