hq: kocho
id: kocho-o1
label: O1
copy: 国民の声を集めて政策に反映する
objective:
- 重要政策に関して、聴く⇒磨/動にパス⇒伝えるサイクルが回り、国民の声を政策に反映している
krs:
- id: kocho-o1-kr1
  k: KR1
  text: 1,000サンプル以上の意見を集め、その結果と示唆を政調に渡した政策論点がある
  summary: 1,000件以上の意見を集め、政調に渡した論点がある
  notes:
  - 声を集める入口（政策LP等）、声の集め方（複数ツールの組み合わせ方や順序・広聴主導）、集めた結果の生かし方、最終的な記録の伝え方を追いかけを含む
  - 参考：過去最高実績はデジタル教科書の800件程度
  metrics:
  - c: 0
    t: 1
    u: 件
  status: 順調
- id: kocho-o1-kr2
  k: KR2
  text: 聴いた意見で、政調の案が進化した/変わった政策の論点 2件
  summary: 集めた声によって、政策が2件以上アップデートされている
  notes:
  - 案を作り直すかどうかは政調判断(driver)だが、政調内で有意な議論を進められるような設計を広聴本部がリードし、PlanC候補と共に材料を渡す
  metrics:
  - c: 未着手
    t: 2
    u: 件
  status: 未着手
- id: kocho-o1-kr3
  k: KR3
  text: 重要政策で、広聴と分析、案の修正や党としての対応決定・国民への公表の3つが完了
  summary: 3件以上の政策について、サイクルが回りきっている
  notes:
  - LP⇒広聴、聞いた声の内容、党内（政調）での議論過程、公表
  metrics:
  - c: 未着手
    t: 3
    u: つ
  status: 未着手
- id: kocho-o1-kr4
  k: KR4
  text: 上記サイクルのマネジメントが常態的にできている（O2に共通）
  summary: サイクルを常に可視化・マネジメントする
