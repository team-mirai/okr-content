goals:
- key: demo
  label: デジタル民主主義
  full: デジタル民主主義
  id: '01'
  copy: デジタル民主主義の一歩目を踏み出す
  o: 全本部が「デジタル民主主義」を中心に動き、サイクルの象徴事例をつくりにいく
  plain:
  - 広聴本部が各本部活動と連携し、デジ民実践・浸透の起点の増産をリード
  - 政調は国民・有識者との熟議を行いながら、法案賛否判断や重要政策づくりを実施
  - 国対は各本部活動と連携し、デジ民サイクルで寄せられた声を政府や他党との合意によって成果として刈り取る
  - 議員本部は各議員室で最低1件デジ民実践事例をつくる
  - 広報本部は議論の過程含めすべてオープンしつつ、戦略的に伝えていく
  - 組織活動本部は、サポーターと連携し、デジタル民主主義プロダクトが使われる実践の場の量と質を最大化する
- key: open
  label: オープン
  full: オープン
  id: '02'
  copy: 党内や政治を抜本的にオープンにする
  o: 徹底的にオープンにする
  plain:
  - 党内の議論と意思決定の過程が、オープンになっている
  - ブラックボックス化した政治を党自身から開くことがチみのコアコンピタンス
  - 判断の結果だけでなく、判断基準と検討の過程を可能な限り表に出す
  - 全法案の賛否と根拠が整理され、党内外から参照・検証可能な形になっている
- key: org
  label: 組織強化
  full: 組織強化
  id: '03'
  copy: 同じ目標に向かって動ける強いチームをつくる
  o: 党のミッション・OKRが共通言語として党内に浸透し、各自が当事者意識を持ち、行動規範・意思決定軸として機能している
  plain:
  - 結果として、全体目標が共通認識化され、組織があるべき姿で動けている
  - あらゆる仕事において、デジタル民主主義サイクルのどこに寄与しているか、を意識した成果設定ができている
  - 党のミッション・OKRに照らして優先順位の判断がされ、「選択と集中」が実行できている
  - DACIのプロセス/スキームに沿った進行・意思決定がされ、成果を出すためのスピードが3Qと比べて飛躍的に上がっている
  - OKRに対する進捗が定期的にモニタリングできている
- key: talent
  label: 採用
  full: 採用
  id: '04'
  copy: 組織を率いる人材を採用する
  o: 本部長候補/高度専門人材に対する組織的な採用計画と行動がなされ、複数名の本部長候補の参画が決まっている
